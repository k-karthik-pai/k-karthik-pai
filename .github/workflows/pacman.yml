name: Generate Pac-Man contribution graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Generate Pac-Man graph
        uses: Platane/snk@v3
        with:
          github_user_name: k-karthik-pai
          outputs: |
            dist/pacman-contribution-graph.svg?palette=github-dark&color_snake=%23facc15&color_dots=%23161b22%230d4429%23006d32%2326a641%2339d353

      - name: Publish generated graph
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
